[project]
name = "transparencia_partidaria_br"
version = "0.1.0"
description = "Análise de transparência, finanças, risco e estrutura de partidos políticos brasileiros com dados abertos (TSE, CNPJ, CEIS, IBGE)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
    { name = "Nícolas Oliveira" }
]

keywords = [
    "dados-abertos",
    "transparencia",
    "partidos",
    "politica",
    "tse",
    "analise-financeira",
    "compliance",
    "nbsa",
    "data-science"
]

dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
    "pyarrow>=15.0",
    "typer>=0.25",
    "rich>=13.0",
    "matplotlib>=3.10.9",
]

# --------------------------------------
# CLI
# --------------------------------------

[project.scripts]
tpbr = "transparencia_partidaria_br.cli.main:app"

# --------------------------------------
# BUILD
# --------------------------------------

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transparencia_partidaria_br"]

# --------------------------------------
# UV (dev only)
# --------------------------------------

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter",
    "ruff",
    "mypy",
    "pytest",
    "pyright"
]

# --------------------------------------
# LINT
# --------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"

# --------------------------------------
# TYPE CHECK
# --------------------------------------

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"

# --------------------------------------
# TEST
# --------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
